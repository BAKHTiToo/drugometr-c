<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Другометр · концепт C</title>
<style>
/* ==========================================================================
   alfa-tokens.css — токены Альфа-Банка для HTML-прототипов
   Источник правды: Research/Концепты главного экрана 2026-10-04/_kit/
     palette.json      — 311 переменных библиотек Альфы (светлая + _inverted)
     android_type.json — шкала Android :: Typography
     design-dump-v2    — реальные iOS-метрики из Figma (Prototypes/promo-activation-history)
   Правило: в прототипе НЕ писать HEX/px руками — только var(--alfa-…).
   Нужен цвет, которого нет ниже, — взять из palette.json, добавить сюда
   с комментарием-источником, а не в CSS экрана.
   ========================================================================== */

/* ---------- Шрифты: только установленные в ~/Library/Fonts ----------------
   Alfa_Interface_Sans_Full-Regular.otf  full name «Alfa Interface Sans Full»,        PS AlfaInterfaceSansFull-Regular
   Alfa_Interface_Sans_Full-Medium.otf   full name «Alfa Interface Sans Full Medium», PS AlfaInterfaceSansFull-Medium
   Alfa_Interface_Sans_Full-Bold.otf     full name «Alfa Interface Sans Full Bold»,   PS AlfaInterfaceSansFull-Bold
   Alfa_Condenced_Bold.otf               full name «Alfa Condenced Bold»,             PS Alfa_Condenced_Bold
   local() в Chrome ищет по full name и PostScript name — даём оба.
   Шрифтов нет на машине зрителя (артефакт, чужой ноутбук) → фоллбек в --alfa-font-sans. */
@font-face {
  font-family: "Alfa Interface Sans";
  src: local("Alfa Interface Sans Full"), local("AlfaInterfaceSansFull-Regular"), local("Alfa Interface Sans Full Regular");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Alfa Interface Sans";
  src: local("Alfa Interface Sans Full Medium"), local("AlfaInterfaceSansFull-Medium");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Alfa Interface Sans";
  src: local("Alfa Interface Sans Full Bold"), local("AlfaInterfaceSansFull-Bold");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
/* Капс-заголовки промо. Только Bold, только крупно.
   ВНИМАНИЕ: в Alfa Condenced НЕТ цифр, «₽», «+», «%» и узкого пробела (проверено CoreText 17.10.2026) —
   цифры в нём падают в фоллбек. Промо-цифры набирать .t-display (Alfa Interface Sans). */
@font-face {
  font-family: "Alfa Condenced";
  src: local("Alfa Condenced Bold"), local("Alfa_Condenced_Bold");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

:root {
  /* ---------- Семейства ---------- */
  --alfa-font-sans: "Alfa Interface Sans", "SF Pro Text", -apple-system, system-ui, Roboto, sans-serif;
  --alfa-font-promo: "Alfa Condenced", "Alfa Interface Sans", "SF Pro Display", sans-serif;

  /* ---------- Начертания ---------- */
  --alfa-fw-regular: 400;
  --alfa-fw-medium: 500;   /* заголовки и кнопки — Medium, как HeadlineX / ActionX в android_type.json */
  --alfa-fw-bold: 700;     /* только акценты: AccentSecondaryMedium, промо-цифры */

  /* ---------- Типографика: 7 кеглей, больше не вводить ----------
     имя            кегль/интерлиньяж   android_type.json            iOS-дамп Figma */
  --alfa-fs-display: 40px;  --alfa-lh-display: 48px;  /* HeadlineXLarge 40/48 Medium   — сумма-герой, промо-цифра (Interface Sans, не Condenced) */
  --alfa-fs-h1: 26px;       --alfa-lh-h1: 32px;       /* HeadlineMedium 26/32 Medium   ≈ iOS 27/32 «Остался 1 друг» */
  --alfa-fs-h2: 20px;       --alfa-lh-h2: 28px;       /* HeadlineSmall 20/28 Medium    ≈ iOS 22/28 заголовок шторки */
  --alfa-fs-body-l: 17px;   --alfa-lh-body-l: 24px;   /* ParagraphPrimaryLarge 18/24   = iOS 17/24 строка ячейки, навбар, кнопка L */
  --alfa-fs-body: 15px;     --alfa-lh-body: 20px;     /* ParagraphPrimarySmall 14/20   = iOS 15/20 (самый частый в дампе) */
  --alfa-fs-caption: 13px;  --alfa-lh-caption: 18px;  /* ParagraphSecondaryLarge 13/20 = iOS 13/18 подписи, тост */
  --alfa-fs-micro: 12px;    --alfa-lh-micro: 16px;    /* ParagraphSecondaryMedium 12/16 — бейджи, таб-бар. Мельче 12 нельзя (чек-лист п. 9) */

  /* ---------- Радиусы: 4 значения ---------- */
  --alfa-r-s: 8px;      /* бейдж-квадрат, иконка 24, внутренний сегмент */
  --alfa-r-m: 12px;     /* кнопки M/S, поле ввода, сегмент-контрол (iOS-дамп: r 12 у «Активировать») */
  --alfa-r-l: 16px;     /* карточки, баннеры, кнопка L, верх шторки (дамп: r 16 — 129 раз) */
  --alfa-r-full: 999px; /* аватары, иконки-кружки, тост, бейдж статуса */

  /* ---------- Отступы ---------- */
  --alfa-space-4: 4px;
  --alfa-space-8: 8px;
  --alfa-space-12: 12px;
  --alfa-space-16: 16px;
  --alfa-space-20: 20px;  /* боковое поле экрана iOS (сетка 20 в дампе) */
  --alfa-space-24: 24px;
  --alfa-space-32: 32px;
  --alfa-gutter: var(--alfa-space-20);

  /* ---------- Каркас iPhone 14 (390×844) ---------- */
  --alfa-device-w: 375px;
  --alfa-device-h: 812px;
  --alfa-statusbar-h: 44px;
  --alfa-navbar-h: 44px;
  --alfa-tabbar-h: 49px;
  --alfa-home-indicator-h: 34px;
  --alfa-control-l: 56px;  /* кнопка L, поле ввода */
  --alfa-control-m: 48px;
  --alfa-control-s: 40px;  /* кнопка S в карточке (дамп: 137×40) */

  /* ---------- Движение ---------- */
  --alfa-ease: cubic-bezier(.4, 0, .2, 1);       /* push — как в web/style.css эталонного прототипа */
  --alfa-ease-out: cubic-bezier(.2, .8, .2, 1);  /* шторка */
  --alfa-dur-push: 360ms;
  --alfa-dur-sheet: 300ms;
  --alfa-dur-fast: 180ms;

  /* ---------- Тени (Альфа почти плоская — тени только у парящего) ---------- */
  --alfa-shadow-float: 0 8px 16px rgb(11 31 53 / .16), 0 0 16px rgb(11 31 53 / .08); /* ToastView в Figma: DROP_SHADOW #0b1f3529 0,8 r16 + #0b1f3514 0,0 r16 */
  --alfa-shadow-card: 0 4px 16px rgb(11 31 53 / .08);                                  /* поднятая карточка поверх контента */
  --alfa-shadow-sheet: 0 -4px 24px rgb(11 31 53 / .08);                                /* край шторки на светлом фоне */

  /* ===================== ЦВЕТ: СВЕТЛАЯ ТЕМА =====================
     В комментарии — переменная palette.json. «a88» = альфа 88 %. */
  color-scheme: light;

  /* Фоны */
  --alfa-bg: #FFFFFF;                          /* base-bg/primary */
  --alfa-bg-secondary: #F2F3F5;                /* base-bg/secondary */
  --alfa-surface: #F2F3F5;                     /* neutral/100 — карточка на белом фоне */
  --alfa-surface-raised: #FFFFFF;              /* base-bg/tertiary — карточка на сером фоне, кнопка на карточке */
  --alfa-surface-modal: #FFFFFF;               /* modal-bg/primary — шторка */
  --alfa-fill-control: rgb(38 55 88 / .06);    /* neutral-translucent/100 #263758 a6 — вторичная кнопка, поле, сегмент */
  --alfa-fill-control-pressed: rgb(15 25 55 / .10); /* neutral-translucent/300 #0F1937 a10 */
  --alfa-separator: rgb(15 25 55 / .10);       /* neutral-translucent/300 #0F1937 a10 */
  --alfa-grabber: #BABBC2;                     /* neutral/500 */
  --alfa-overlay: rgb(0 0 0 / .65);            /* overlay/default #000000 a60 */

  /* Текст и иконки */
  --alfa-text-primary: rgb(3 3 6 / .88);       /* text/primary #030306 a88 */
  --alfa-text-secondary: rgb(4 4 19 / .55);    /* text/secondary #040413 a55 */
  --alfa-text-tertiary: rgb(5 8 29 / .38);     /* text/tertiary #05081D a38 — плейсхолдер, неактивное */
  --alfa-icon-secondary: #898991;              /* neutral/700 — неактивный таб, шеврон */

  /* Акцент */
  --alfa-accent: #EF3124;                      /* accent/primary — красный Альфы: метка, главное действие */
  --alfa-accent-secondary: #212124;            /* accent/secondary — чёрная кнопка */
  --alfa-on-accent: rgb(255 255 255 / .94);    /* static_text_inverted/primary #FFFFFF a94 */
  --alfa-on-accent-secondary: rgb(255 255 255 / .94); /* static_text_inverted/primary */

  /* Статусы: текст / заливка-иконка / подложка бейджа */
  --alfa-positive: #0D9336;                    /* text/positive — зелёный ТОЛЬКО для зачислений */
  --alfa-positive-fill: #0CC44D;               /* status/positive */
  --alfa-positive-bg: #DFF8E5;                 /* status-muted/positive */
  --alfa-attention: #EA8313;                   /* text/attention */
  --alfa-attention-fill: #FA9313;              /* status/attention */
  --alfa-attention-bg: #FFEFD9;                /* status-muted/attention */
  --alfa-negative: #EC2D20;                    /* text/negative */
  --alfa-negative-fill: #FF4837;               /* status/negative */
  --alfa-negative-bg: #FFEBEB;                 /* status-muted/negative */
  --alfa-info: #2A77EF;                        /* text/info */
  --alfa-info-fill: #2288FA;                   /* status/info */
  --alfa-info-bg: #E4F0FF;                     /* status-muted/info */

  /* Тост (всегда тёмный, как ToastView в Figma: #202020 b8 + blur) */
  --alfa-toast-bg: rgb(28 28 30 / .90);        /* static_neutral_inverted/100 #1C1C1E + opacity .9 */
  --alfa-toast-text: rgb(255 255 255 / .94);   /* static_text_inverted/primary */
  --alfa-toast-text-secondary: rgb(238 238 251 / .55); /* static_text_inverted/secondary #EEEEFB a55 */

  /* Стенд вокруг телефона (не часть экрана) */
  --alfa-stage: #EDEEF0;                       /* neutral/200 */
}

/* ===================== ЦВЕТ: ТЁМНАЯ ТЕМА =====================
   Включается: <html data-theme="dark">, ?theme=dark в адресе (starter.html)
   или системной темой, если data-theme не задан. Все значения — *_inverted. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --alfa-bg: #121213;                          /* base-bg_inverted/primary */
  --alfa-bg-secondary: #1C1C1E;                /* base-bg_inverted/secondary */
  --alfa-surface: #1C1C1E;                     /* neutral_inverted/100 */
  --alfa-surface-raised: #29292C;              /* base-bg_inverted/tertiary */
  --alfa-surface-modal: #1C1C1E;               /* modal-bg_inverted/primary */
  --alfa-fill-control: rgb(214 214 229 / .07); /* neutral-translucent_inverted/100 #D6D6E5 a7 */
  --alfa-fill-control-pressed: rgb(222 222 238 / .13); /* neutral-translucent_inverted/300 #DEDEEE a13 */
  --alfa-separator: rgb(222 222 238 / .13);    /* neutral-translucent_inverted/300 */
  --alfa-grabber: #4A4A51;                     /* neutral_inverted/500 */
  --alfa-overlay: rgb(0 0 0 / .65);            /* overlay/default */

  --alfa-text-primary: rgb(255 255 255 / .94); /* text_inverted/primary #FFFFFF a94 */
  --alfa-text-secondary: rgb(238 238 251 / .55); /* text_inverted/secondary #EEEEFB a55 */
  --alfa-text-tertiary: rgb(233 233 250 / .37);  /* text_inverted/tertiary #E9E9FA a37 */
  --alfa-icon-secondary: #898991;              /* neutral_inverted/700 */

  --alfa-accent: #F83A2A;                      /* accent_inverted/primary */
  --alfa-accent-secondary: #F2F3F5;            /* accent_inverted/secondary — «чёрная» кнопка в тёмной теме светлая */
  --alfa-on-accent: rgb(255 255 255 / .94);    /* static_text_inverted/primary */
  --alfa-on-accent-secondary: rgb(3 3 6 / .88); /* static_text/primary */

  --alfa-positive: #0CC44D;                    /* text_inverted/positive */
  --alfa-positive-fill: #17D055;               /* status_inverted/positive */
  --alfa-positive-bg: #232D25;                 /* status-muted_inverted/positive */
  --alfa-attention: #FA9313;                   /* text_inverted/attention */
  --alfa-attention-fill: #FDA136;              /* status_inverted/attention */
  --alfa-attention-bg: #36291F;                /* status-muted_inverted/attention */
  --alfa-negative: #FF4837;                    /* text_inverted/negative */
  --alfa-negative-fill: #FF4837;               /* status_inverted/negative */
  --alfa-negative-bg: #392523;                 /* status-muted_inverted/negative */
  --alfa-info: #4A9DFC;                        /* text_inverted/info */
  --alfa-info-fill: #3193FC;                   /* status_inverted/info */
  --alfa-info-bg: #222A3E;                     /* status-muted_inverted/info */

  --alfa-toast-bg: rgb(53 53 57 / .94);        /* modal-bg_inverted/tertiary #353539 + opacity .94 */
  --alfa-shadow-float: 0 8px 16px rgb(0 0 0 / .40), 0 0 16px rgb(0 0 0 / .20);
  --alfa-shadow-card: 0 4px 16px rgb(0 0 0 / .32);
  --alfa-shadow-sheet: 0 -4px 24px rgb(0 0 0 / .32);
  --alfa-stage: #262629;                       /* neutral_inverted/0 */
}

/* Системная тёмная тема, если тема не задана явно — те же значения */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --alfa-bg: #121213;
    --alfa-bg-secondary: #1C1C1E;
    --alfa-surface: #1C1C1E;
    --alfa-surface-raised: #29292C;
    --alfa-surface-modal: #1C1C1E;
    --alfa-fill-control: rgb(214 214 229 / .07);
    --alfa-fill-control-pressed: rgb(222 222 238 / .13);
    --alfa-separator: rgb(222 222 238 / .13);
    --alfa-grabber: #4A4A51;
    --alfa-text-primary: rgb(255 255 255 / .94);
    --alfa-text-secondary: rgb(238 238 251 / .55);
    --alfa-text-tertiary: rgb(233 233 250 / .37);
    --alfa-accent: #F83A2A;
    --alfa-accent-secondary: #F2F3F5;
    --alfa-on-accent-secondary: rgb(3 3 6 / .88);
    --alfa-positive: #0CC44D;
    --alfa-positive-fill: #17D055;
    --alfa-positive-bg: #232D25;
    --alfa-attention: #FA9313;
    --alfa-attention-fill: #FDA136;
    --alfa-attention-bg: #36291F;
    --alfa-negative: #FF4837;
    --alfa-negative-fill: #FF4837;
    --alfa-negative-bg: #392523;
    --alfa-info: #4A9DFC;
    --alfa-info-fill: #3193FC;
    --alfa-info-bg: #222A3E;
    --alfa-toast-bg: rgb(53 53 57 / .94);
    --alfa-shadow-float: 0 8px 16px rgb(0 0 0 / .40), 0 0 16px rgb(0 0 0 / .20);
    --alfa-shadow-card: 0 4px 16px rgb(0 0 0 / .32);
    --alfa-shadow-sheet: 0 -4px 24px rgb(0 0 0 / .32);
    --alfa-stage: #262629;
  }
}

/* ---------- Типографические классы (единственное место, где кегль связан с текстом) ---------- */
.t-display { font: var(--alfa-fw-medium) var(--alfa-fs-display)/var(--alfa-lh-display) var(--alfa-font-sans); letter-spacing: -.01em; }
.t-promo   { font: var(--alfa-fw-bold) var(--alfa-fs-h1)/var(--alfa-lh-h1) var(--alfa-font-promo); text-transform: uppercase; } /* только буквы */
.t-h1      { font: var(--alfa-fw-medium) var(--alfa-fs-h1)/var(--alfa-lh-h1) var(--alfa-font-sans); }
.t-h2      { font: var(--alfa-fw-medium) var(--alfa-fs-h2)/var(--alfa-lh-h2) var(--alfa-font-sans); }
.t-body-l  { font: var(--alfa-fw-regular) var(--alfa-fs-body-l)/var(--alfa-lh-body-l) var(--alfa-font-sans); }
.t-body    { font: var(--alfa-fw-regular) var(--alfa-fs-body)/var(--alfa-lh-body) var(--alfa-font-sans); }
.t-caption { font: var(--alfa-fw-regular) var(--alfa-fs-caption)/var(--alfa-lh-caption) var(--alfa-font-sans); }
.t-micro   { font: var(--alfa-fw-medium) var(--alfa-fs-micro)/var(--alfa-lh-micro) var(--alfa-font-sans); }
.t-medium  { font-weight: var(--alfa-fw-medium); }
.t-secondary { color: var(--alfa-text-secondary); }
.t-tertiary  { color: var(--alfa-text-tertiary); }
.t-positive  { color: var(--alfa-positive); }
.t-negative  { color: var(--alfa-negative); }
.t-num { font-variant-numeric: tabular-nums; }

</style>
<style>
/* ==========================================================================
   components.css — каркас iPhone и компоненты прототипа на токенах Альфы.
   Только var(--alfa-…) из alfa-tokens.css. Ни одного HEX, кегля или радиуса руками.
   Метрики — из Figma-дампа Prototypes/promo-activation-history/design-dump-v2.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--alfa-font-sans);
  font-size: var(--alfa-fs-body);
  line-height: var(--alfa-lh-body);
  color: var(--alfa-text-primary);
  -webkit-font-smoothing: antialiased;
  font-kerning: normal;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
svg.i { width: 24px; height: 24px; flex: none; fill: currentColor; display: block; }

/* ---------- Стенд: телефон по центру на десктопе, во весь экран на телефоне ---------- */
.stage {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: var(--alfa-space-24);
  background: var(--alfa-stage);
}
.device {
  position: relative;
  width: var(--alfa-device-w);
  height: var(--alfa-device-h);
  overflow: hidden;
  overflow: clip; /* clip, а не hidden: фокус и scrollIntoView не сдвигают «телефон» */
  isolation: isolate;
  background: var(--alfa-bg);
  border-radius: 48px; /* lint:allow — скругление корпуса телефона, не часть UI */
  box-shadow: var(--alfa-shadow-card);
}
/* Узкое окно (скриншоты 375 / 320, реальный телефон): телефон = окно */
@media (max-width: 480px) {
  .stage { padding: 0; display: block; }
  .device { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
  .stage-tools { display: none; }
}
.stage-tools {
  position: fixed;
  top: var(--alfa-space-16);
  right: var(--alfa-space-16);
  display: flex;
  gap: var(--alfa-space-8);
}

/* ---------- Статус-бар 47 (iPhone 14) ---------- */
.statusbar {
  position: absolute; z-index: 40; top: 0; left: 0; right: 0;
  height: var(--alfa-statusbar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--alfa-space-12) var(--alfa-space-32) 0;
  color: var(--alfa-text-primary);
  pointer-events: none;
}
.statusbar__time { font: var(--alfa-fw-medium) var(--alfa-fs-body-l)/var(--alfa-lh-body-l) var(--alfa-font-sans); width: 54px; text-align: center; }
.statusbar__icons { display: flex; align-items: center; gap: var(--alfa-space-4); }
.statusbar__icons svg { fill: currentColor; display: block; }
.statusbar--on-dark { color: var(--alfa-on-accent); }

/* ---------- Home indicator ---------- */
.home-indicator {
  position: absolute; z-index: 60; left: 50%; bottom: var(--alfa-space-8);
  width: 134px; height: 5px; margin-left: -67px;
  border-radius: var(--alfa-r-full);
  background: var(--alfa-text-primary);
  pointer-events: none;
}

/* ---------- Экраны и переходы ---------- */
.screens { position: absolute; inset: 0; overflow: hidden; overflow: clip; }
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding-top: var(--alfa-statusbar-h);
  background: var(--alfa-bg);
  overflow: hidden; overflow: clip;
  visibility: hidden;
  will-change: transform;
}
.screen.is-active { visibility: visible; z-index: 2; }
.screen--secondary { background: var(--alfa-bg-secondary); }
.screen__content {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding: 0 var(--alfa-gutter) calc(var(--alfa-home-indicator-h) + var(--alfa-space-24));
}
.screen__content::-webkit-scrollbar { display: none; }
.screen.has-tabbar .screen__content { padding-bottom: calc(var(--alfa-tabbar-h) + var(--alfa-home-indicator-h) + var(--alfa-space-24)); }
.screen__footer {
  flex: none;
  padding: var(--alfa-space-12) var(--alfa-gutter) calc(var(--alfa-home-indicator-h) + var(--alfa-space-8));
  background: var(--alfa-bg);
}

/* push: новый экран въезжает справа, старый уходит на 30 % влево */
.screen.push-in      { visibility: visible; z-index: 3; transform: translateX(100%); }
.screen.push-out     { visibility: visible; z-index: 2; }
.screen.pop-in       { visibility: visible; z-index: 2; transform: translateX(-30%); }
.screen.pop-out      { visibility: visible; z-index: 3; }
.screens.is-animating .screen { transition: transform var(--alfa-dur-push) var(--alfa-ease); }
.screen.push-in.go, .screen.pop-in.go { transform: none; }
.screen.push-out.go  { transform: translateX(-30%); }

  UI.toggle = (f, p, on) => {
    const cur = UI.state.selected[f] || [];
    const want = on === undefined ? !cur.includes(p) : on;
    UI.state.selected[f] = want ? (cur.includes(p) ? cur : [...cur, p]) : cur.filter(x => x !== p);
    if (!UI.state.selected[f].length) delete UI.state.selected[f];
    UI.emit('select');
  };
  UI.setExpanded = f => { UI.state.expanded = f; UI.emit('expand'); };
  UI.setVariant = (k, v) => { UI.state.v[k] = v; UI.emit('variant'); };
  UI.friendSum = f => (UI.state.selected[f] || []).reduce((s, p) => s + DATA.products[p].reward, 0);
  UI.totals = () => {
    const list = DATA.friends.filter(f => UI.state.selected[f.id]).map(f => ({ friend: f, products: UI.state.selected[f.id].slice(), sum: UI.friendSum(f.id) }));
    return { list, friends: list.length, products: list.reduce((s, x) => s + x.products.length, 0), sum: list.reduce((s, x) => s + x.sum, 0) };
  };
})();

     credit(cx, cy, rot, rect) — плитка 40,109×49,659 r13 #DFF8E5, картинка в прямоугольнике rect = [l, t, w, h] из узла. */
  const pic = (f, cx, cy, w, h, rot = 0) =>
    `<img class="hi-pic" src="${A}${f}" alt="" style="left:${(cx - w / 2).toFixed(2)}px;top:${(cy - h / 2).toFixed(2)}px;width:${w}px;height:${h}px${rot ? `;transform:rotate(${rot}deg)` : ''}">`;
  const credit = (cx, cy, rot, [l, t, w, h]) =>
    `<span class="hi-tile" style="left:${(cx - 20.05).toFixed(2)}px;top:${(cy - 24.83).toFixed(2)}px${rot ? `;transform:rotate(${rot}deg)` : ''}">` +
    `<img src="${A}prod-credit.png" alt="" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"></span>`;
  const BIZ = (cx, cy) => pic('tile-biz-r15.png', cx, cy, 51.595, 58.347);           // 22968:141492, повёрнута на 15°
  const ALFA = (cx, cy, rot) => pic('tile-alfa.png', cx, cy, 40.109, 49.659, rot);    // 22968:141505

  /* Друзья истории — как в узле П1 (группы «В пути» и скрытая «Получено»). */
  const ROWS = {
    path: [
      { id: 'bakhtiyor', initials: 'БК', name: 'Бахтиёр К.', badge: '+3,5к', sub: '2 продукта',
        pics: `<span class="hi-pics hi-pics--r69">${BIZ(25.8, 29.17)}${ALFA(61.44, 29.29, -6.69)}</span>` },
      { id: 'german', initials: 'ГГ', name: 'Герман Г.', badge: '+1,5к', sub: `Альфа${NBH}Карта`,
        pics: `<span class="hi-pics hi-pics--r56">${ALFA(20.05, 27.83)}</span>` },
    ],
    got: [
      { id: 'alexander', initials: 'АП', name: 'Александр П.', badge: '+12к', sub: '3 продукта',
        pics: `<span class="hi-pics hi-pics--r108">${BIZ(95.6, 29.17)}${ALFA(59.75, 29.29)}${credit(24.85, 29.46, 12.2, [-11.83, -2.65, 69.87, 61.14])}</span>` },
      { id: 'irina', initials: 'ИК', name: 'Ирина К.', badge: '+5,5к', sub: '2 продукта',
        pics: `<span class="hi-pics hi-pics--r69">${BIZ(25.8, 29.17)}${credit(64.22, 29.83, 0, [-8.83, -1.65, 60.81, 49.41])}</span>` },
    ],
  };

  /* Шторка П1.1. Бахтиёр — из узла 22968:141549; Герман — допущение по аналогии (в макете шторки нет). */
  const SHEET = {
    bakhtiyor: { name: 'Бахтиёр К.', text: `Оформляет кредитную карту<br>и Альфа${NBH}Карту`, sum: 3500,
      pics: pic('sheet-biz.png', 79.19, 80.32, 158.287, 179.004) + pic('sheet-alfa.png', 191.81, 81.49, 158.287, 179.004) }, // 22968:141641, 22968:141643
    german: { name: 'Герман Г.', text: `Оформляет Альфа${NBH}Карту`, sum: 1500,
      pics: pic('sheet-alfa.png', 135.5, 81.49, 158.287, 179.004) }, // одна плитка по центру — допущение
  };

  const card = (r, kind) => {
    const tap = SHEET[r.id] && kind === 'path';
    return `<${tap ? 'button type="button"' : 'div'} class="hi-card" ${tap ? `data-hi-friend="${r.id}"` : ''}>
      <span class="hi-ava"><span class="hi-ava__ini">${r.initials}</span><span class="hi-ava__badge hi-ava__badge--${kind}">${r.badge}</span></span>
      <span class="hi-card__text"><span class="hi-card__name">${r.name}</span><span class="hi-card__sub">${r.sub}</span></span>
      ${r.pics}
    </${tap ? 'button' : 'div'}>`;
  };
  const group = (kind, title, rows) => `<section class="hi-group" data-hi-group="${kind}">
      <div class="hi-group__head"><span class="hi-group__title">${title}</span><span class="hi-group__count">${rows.length}${NB}${UI.plural(rows.length, ['друг', 'друга', 'друзей'])}</span></div>
      ${rows.map(r => card(r, kind)).join('')}
    </section>`;

  let filter = 'path';
  function render() {
    UI.fill('scr-history', `
      <div class="hi-nav">
        <button class="hi-nav__back" type="button" data-hi-back aria-label="Назад"><img src="${A}back.svg" alt="" width="24" height="24"></button>
        <div class="hi-nav__title">История рекомендаций</div>
      </div>
      <div class="screen__content hi-content">
        <div class="hi-chips" role="tablist">
          ${[['all', 'Все'], ['path', 'В пути'], ['got', 'Получено']].map(([v, t]) =>
            `<button type="button" class="hi-chip${v === filter ? ' is-active' : ''}" data-hi-filter="${v}" role="tab">${t}</button>`).join('')}
        </div>
        ${group('path', 'В пути', ROWS.path)}
        ${group('got', 'Получено', ROWS.got)}
        <p class="hi-note">Деньги приходят на${NB}счёт в${NB}Альфа${NBH}Банке в${NB}течение 30${NB}дней после того, как друг выполнит условия</p>
      </div>`);
    applyFilter();
  }
  function applyFilter() {
    const scr = document.getElementById('scr-history');
    scr.querySelectorAll('[data-hi-filter]').forEach(c => c.classList.toggle('is-active', c.dataset.hiFilter === filter));
    scr.querySelectorAll('[data-hi-group]').forEach(g => { g.hidden = filter !== 'all' && g.dataset.hiGroup !== filter; });
  }

  function renderSheet(id) {
    const s = SHEET[id];
    UI.fill('sheet-friend', `
      <div class="sheet__grabber hi-sh__grabber"></div>
      <div class="hi-sh__head" data-drag><button type="button" class="hi-sh__close" data-close aria-label="Закрыть"><img src="${A}close.svg" alt="" width="24" height="24"></button></div>
      <div class="hi-sh__body">
        <div class="hi-sh__pics">${s.pics}</div>
        <div class="hi-sh__name">${s.name}</div>
        <div class="hi-sh__text">${s.text}</div>
        <div class="hi-coach">
          <img class="hi-coach__face" src="${A}face-innocent.png" alt="" width="48" height="48">
          <div class="hi-coach__bubble">Получите до${NB}${UI.money(s.sum)} за${NB}друга, когда он выполнит условия</div>
        </div>
      </div>`);
  }

  /* ---------- Мосты ---------- */
  UI.openHistory = () => { filter = 'path'; applyFilter(); alfa.go('history'); };
  UI.openFriendHistory = id => { if (!SHEET[id]) return; renderSheet(id); alfa.openSheet('friend'); };

  document.addEventListener('click', e => {
    const f = e.target.closest('[data-hi-filter]');
    if (f) { filter = f.dataset.hiFilter; applyFilter(); return; }
    const c = e.target.closest('[data-hi-friend]');
    if (c) { UI.openFriendHistory(c.dataset.hiFriend); return; }
    if (e.target.closest('[data-hi-back]')) alfa.back();
  });

  render();
  renderSheet('bakhtiyor');
  UI.on(reason => { if (reason === 'variant') applyFilter(); });
})();

</script>

   Мосты: UI.openRefMain({ to: 'invited' | 'top' }), UI.openSteps(friendId, productId).

(() => {

          </div>

        </div>

  <div class="rm-h" data-rm-anchor="invited">Кого пригласили</div>

  <div class="rm-h">Дополнительные возможности</div>

    <div class="rm-story rm-press"><img class="rm-story__img rm-story__img--c" src="${A}story-3.png" alt=""><div class="rm-story__shade"></div><div class="rm-story__title">Сериал<br>о${NB}нас и${NB}о${NB}вас</div></div>

  <div class="rm-rail rm-tags">

  </div>
  <div class="rm-prods">
    <div class="rm-pcard">
      <div class="rm-pcard__img"><img class="rm-pimg--kids" src="${A}kids.png" alt=""></div>
      <div class="rm-pcard__body">
        <div class="rm-pcard__txt"><div class="rm-pcard__title">Альфа‑Карта<br>с${NB}детской</div><div class="rm-pcard__sub">Вам 3000${NB}₽, другу 30% кэшбэк</div></div>
        <button class="rm-pcard__btn rm-press">Рекомендовать</button>
      </div>
      <div class="rm-chips"><span class="rm-chip rm-chip--promo">Акция</span><span class="rm-chip rm-chip--x2">х2 бонус</span></div>

        <button class="rm-pcard__btn rm-press">Рекомендовать</button>
      </div>
      <div class="rm-chips"><span class="rm-chip rm-chip--promo">Акция</span></div>

  <div class="rm-prods">

</div>`);
  }

  /* ---------- П2.1 / П2.2 ---------- */
  const CHIP = { you: 'Вы', friend: 'Друг', bank: 'Банк' };
  // Шаги по Альфа‑Карте — дословно с П2.1 (22968:142133) и П2.2 (22968:142395)
  const STEPS = [
    { who: 'you',    title: 'Отправили ссылку', sub: 'В мессенджер или по QR‑коду' },
    { who: 'friend', title: `Оформляет Альфа‑Карту<br>по${NB}ссылке`, sub: 'Статус появится на главном экране<br>и в истории операций' },
    { who: 'friend', title: 'Делает покупку картой', sub: `На${NB}любую сумму` },
    { who: 'you',    title: 'Выполняете своё условие', sub: `Покупки на${NB}3000${NB}₽ или 5${NB}покупок за${NB}90${NB}дней до${NB}или${NB}после рекомендации` },
    { who: 'bank',   title: `Начисляем до${NB}2000${NB}₽`, titleDone: `Начислили 2000${NB}₽`, sub: `В${NB}течение 7–10 рабочих дней после выполнения условий`, paid: `+2000${NB}₽ начислено` },
  ];
  let cur = { friendId: 'bakhtiyor', productId: 'alfa' };

  function renderSteps() {
    const done = UI.state.v.steps === 'done';
    const f = UI.friend(cur.friendId) || UI.friend('bakhtiyor');
    const p = UI.product(cur.productId) || UI.product('alfa');
    const progress = done ? 5 : 1; // сколько шагов пройдено; на П2.1 пройден шаг 1, текущий — 2
    const st = i => i < progress ? 'done' : (i === progress ? 'cur' : 'todo');
    document.getElementById('sheet-steps').classList.toggle('rm-done', done);
    UI.fill('sheet-steps', `
<div class="sheet__grabber"></div>

      <div class="rm-step__num rm-step__num--${st(i)}">${i + 1}</div>
      ${i < STEPS.length - 1 ? `<div class="rm-step__line rm-step__line--${i < progress ? 'done' : i === progress ? 'cur' : 'todo'}"></div>` : ''}
      <div class="rm-step__main">
        <div class="rm-step__top"><span class="rm-step__chip rm-step__chip--${s.who}">${CHIP[s.who]}</span>${done && s.paid ? `<span class="rm-step__paid">${s.paid}</span>` : ''}</div>
        <div class="rm-step__txt"><div class="rm-step__title">${done && s.titleDone ? s.titleDone : s.title}</div><div class="rm-step__sub">${s.sub}</div></div>
      </div>
    </div>`).join('')}
  </div>
</div>
${done
  ? `<div class="rm-st-foot rm-st-foot--done"><button class="rm-history-btn rm-press">История начислений</button></div>`
  : `<div class="rm-st-foot"><button class="rm-faq rm-press"><span>Частые вопросы</span><img src="${A}chevron-right.svg" alt=""></button></div>`}`);
  }

  /* ---------- Мосты ---------- */
  function scrollTo(to) {
    const sc = document.querySelector('#scr-refmain .rm-scroll');
    if (!sc) return;
    if (to === 'invited') {
      const h = sc.querySelector('[data-rm-anchor="invited"]');
      sc.scrollTop = Math.max(0, h.offsetTop - INVITED_TOP);
    } else sc.scrollTop = 0;
  }
  UI.openRefMain = ({ to = 'top' } = {}) => {
    if (alfa.top() !== 'refmain') alfa.go('refmain');
    scrollTo(to); // роутер уже сбросил скролл в начало при push — ставим сразу, без анимации
    const dur = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--alfa-dur-push')) || 360) + 40;
    setTimeout(() => scrollTo(to), dur); // и ещё раз после окончания перехода
  };
  UI.openSteps = (friendId, productId = 'alfa') => {
    cur = { friendId, productId };
    renderSteps();
    alfa.openSheet('steps');
  };

  /* ---------- События ---------- */
  document.addEventListener('click', e => {
    const t = e.target;
    const btn = t.closest('[data-rm]');
    if (btn && btn.dataset.rm === 'close') {
      // есть куда вернуться — назад, иначе новый корень — Другометр
      alfa.back();
      if (alfa.top() === 'refmain') alfa.reset('drugometr');
      return;
    }
    if (btn && btn.dataset.rm === 'earn') { alfa.go('drugometr'); return; }
    const fr = t.closest('[data-rm-friend]');
    if (fr) { UI.openSteps(fr.dataset.rmFriend, 'alfa'); return; }
    const step = t.closest('#sheet-steps [data-rm-step]');
    if (step && UI.state.v.steps !== 'done') UI.setVariant('steps', 'done');
  });

  renderMain();
  renderSteps();
  UI.on(reason => { if (reason === 'variant') renderSteps(); });
})();

</script>
<script>
/* variants.js — скрытое меню вариантов прототипа (оркестратор).
   Открывается тапом по заголовку «Другометр» в навбаре (UI.openVariants) или параметрами адреса:
   ?more=2 (М2 окно) · ?path=2 (П2 «Кого пригласили») · ?full=1 (C1.1 шкала заполнена) · ?steps=done (П2.2).
   Выбор пишется в адрес (replaceState), чтобы ссылкой можно было поделиться ровно этим вариантом. */
(() => {
  const NB = ' ';
  const GROUPS = [
    { key: 'more', title: 'Тап по «Можно ещё»', opts: [['1', 'М1 · скролл'], ['2', 'М2 · окно']] },
    { key: 'path', title: 'Тап по «В пути»', opts: [['1', 'П1 · история'], ['2', 'П2 · кого пригласили']] },
    { key: 'full', title: 'Шкала', opts: [['0', 'C1 · обычная'], ['1', 'C1.1 · заполнена']] },
    { key: 'steps', title: 'Шаги друга', opts: [['progress', 'П2.1 · в' + NB + 'процессе'], ['done', 'П2.2 · начислено']] },
  ];
  const val = k => k === 'full' ? (UI.state.v.full ? '1' : '0') : UI.state.v[k];
  function render() {
    UI.fill('sheet-variants', `
      <div class="sheet__grabber"></div>
      <div class="sheet__header vr-head"><div class="vr-title">Варианты прототипа</div>
        <button class="vr-x" data-close aria-label="Закрыть"><svg class="i"><use href="#i-close"/></svg></button></div>
      <div class="sheet__body vr-body">
        ${GROUPS.map(g => `<div class="vr-group"><div class="vr-label">${g.title}</div>
          <div class="vr-seg" data-key="${g.key}">${g.opts.map(([v, t]) => `<button class="vr-opt${val(g.key) === v ? ' is-active' : ''}" data-v="${v}">${t}</button>`).join('')}</div></div>`).join('')}
        <button class="vr-reset" data-reset>Сбросить выбор продуктов</button>
      </div>`);
  }
  function syncUrl() {
    const q = new URLSearchParams(location.search), v = UI.state.v;
    v.more === '2' ? q.set('more', '2') : q.delete('more');
    v.path === '2' ? q.set('path', '2') : q.delete('path');
    v.full ? q.set('full', '1') : q.delete('full');
    v.steps === 'done' ? q.set('steps', 'done') : q.delete('steps');
    const s = q.toString();
    history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + location.hash);
  }
  document.getElementById('sheet-variants').addEventListener('click', e => {
    const o = e.target.closest('.vr-opt');
    if (o) { const k = o.parentElement.dataset.key; UI.setVariant(k, k === 'full' ? o.dataset.v === '1' : o.dataset.v); syncUrl(); render(); }
    if (e.target.closest('[data-reset]')) { UI.state.selected = {}; UI.state.expanded = null; UI.emit('select'); alfa.closeSheet(); alfa.toast('Выбор сброшен'); }
  });
  UI.openVariants = () => { render(); alfa.openSheet('variants'); };
})();

</script>
<script>
/* router.js — роутер из proto-starter (без изменений логики). Подключается ПОСЛЕ screens/*.js. */

/* ======================= Роутер прототипа =======================
   Без зависимостей. Состояние: стек экранов текущего таба. */
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const root = document.documentElement;
  const screensEl = $('#screens');
  const tabbar = $('#tabbar');
  const screen = id => $(`.screen[data-screen="${id}"]`);
  const TABS = $$('.tabbar__item').map(b => b.dataset.tab);
  const DUR = parseFloat(getComputedStyle(root).getPropertyValue('--alfa-dur-push')) || 360;
  const START = document.body.dataset.start || TABS[0];
  let stack = [START];
  let busy = false;

  /* ---------- Деньги: тонкие неразрывные разряды, запятая, NBSP перед ₽ ---------- */
  const NNBSP = ' ', NBSP = ' ', MINUS = '−';
  function money(value, { sign = false, minor = 'auto' } = {}) {
    const neg = value < 0, abs = Math.abs(value);
    const int = Math.floor(abs + 1e-9), kop = Math.round((abs - int) * 100);
    const intStr = String(int).replace(/\B(?=(\d{3})+(?!\d))/g, NNBSP);
    const pre = neg ? MINUS : (sign && value > 0 ? '+' : '');
    const showMinor = minor === true || (minor === 'auto' && kop > 0);
    const minorStr = showMinor ? ',' + String(kop).padStart(2, '0') : '';
    return { text: pre + intStr + minorStr + NBSP + '₽',
             html: pre + intStr + (minorStr ? `<span class="amount__minor">${minorStr}</span>` : '') + NBSP + '₽' };
  }
  function renderMoney(r = document) { $$('[data-money]', r).forEach(el => { el.innerHTML = money(+el.dataset.money, { sign: el.hasAttribute('data-money-sign') }).html; }); }
  window.alfa = { money, go, back, tab, reset, openSheet, closeSheet, closeAll, toast, renderMoney, top: () => stack[stack.length - 1] };

  /* ---------- Экраны ---------- */
  function setActive(id) {
    $$('.screen.is-active').forEach(s => s.classList.remove('is-active'));
    screen(id).classList.add('is-active');
    tabbar.classList.toggle('is-hidden', !screen(id).classList.contains('has-tabbar'));
    $('.statusbar').classList.toggle('statusbar--on-dark', screen(id).dataset.statusbar === 'dark');
    const t = screen(id).dataset.tabhl || (TABS.includes(stack[0]) ? stack[0] : TABS[0]); // data-tabhl — какой таб подсвечен в макете
    $$('.tabbar__item').forEach(b => b.classList.toggle('is-active', b.dataset.tab === t));
    history.replaceState(null, '', location.pathname + location.search + '#' + id);
  }
  function animate(from, to, kind) {
    if (!from || from === to) { setActive(to.dataset.screen); return; }
    busy = true;
    const cls = { push: ['push-out', 'push-in'], pop: ['pop-out', 'pop-in'], fade: [null, 'fade-in'] }[kind];
    if (cls[0]) from.classList.add(cls[0]);
    to.classList.add(cls[1]);
    if (kind !== 'pop') to.querySelector('.screen__content')?.scrollTo(0, 0); // «назад» сохраняет место в списке
    tabbar.classList.toggle('is-hidden', !to.classList.contains('has-tabbar'));
    screensEl.classList.add('is-animating');
    screensEl.style.pointerEvents = 'none'; // тап во время перехода не должен попадать в уходящий экран
    void to.offsetWidth;
    requestAnimationFrame(() => { from.classList.add('go'); to.classList.add('go'); });
    setTimeout(() => {
      screensEl.classList.remove('is-animating');
      screensEl.style.pointerEvents = '';
      [from, to].forEach(s => s.classList.remove('push-out', 'push-in', 'pop-out', 'pop-in', 'fade-in', 'go'));
      setActive(to.dataset.screen);
      busy = false;
    }, kind === 'fade' ? 200 : DUR + 20);
  }
  function go(id, kind = 'push') {
    if (busy || !screen(id)) return;
    const from = screen(stack[stack.length - 1]);
    stack.push(id);
    animate(from, screen(id), kind);
  }
  function back() {
    if (busy || stack.length < 2) return;
    const from = screen(stack.pop());
    animate(from, screen(stack[stack.length - 1]), 'pop');
  }
  function reset(id, kind = 'pop') { // новый корень стека (например, «Назад» с корневого экрана)
    if (busy || !screen(id)) return;
    closeAll();
    const from = screen(stack[stack.length - 1]);
    stack = [id];
    animate(from, screen(id), kind);
  }
  function tab(id) {
    if (busy) return;
    closeAll();
    stack = [id];
    setActive(id);
    screen(id).querySelector('.screen__content')?.scrollTo(0, 0);
  }

  /* ---------- Шторки: стек (шторка поверх шторки, C8 над C7). Один скрим — сразу под верхней шторкой ---------- */
  const scrim = $('#scrim');
  const open = []; // id открытых шторок, последний — верхний
  const sheetEl = id => $(`.sheet[data-sheet-id="${id}"]`);
  function restack() {
    open.forEach((id, i) => { sheetEl(id).style.zIndex = 55 + i * 2; });
    scrim.style.zIndex = open.length ? 54 + (open.length - 1) * 2 : '';
    scrim.classList.toggle('is-open', open.length > 0);
  }
  function openSheet(id, { over = false } = {}) {
    const s = sheetEl(id); if (!s) return;
    if (!over) while (open.length) closeSheet(true);
    if (open.includes(id)) return;
    open.push(id); s.style.transform = '';
    s.classList.remove('is-closing');
    void s.offsetWidth;
    s.classList.add('is-open'); restack();
    document.dispatchEvent(new CustomEvent('sheet:open', { detail: id }));
  }
  function closeSheet(instant) {
    if (!open.length) return;
    const id = open.pop(), s = sheetEl(id);
    s.classList.remove('is-open'); s.style.transform = '';
    restack();
    document.dispatchEvent(new CustomEvent('sheet:close', { detail: id }));
    if (instant === true) return;
    s.classList.add('is-closing');
    setTimeout(() => { s.classList.remove('is-closing'); if (!open.includes(id)) s.style.zIndex = ''; }, 320);
  }
  function closeAll() { while (open.length) closeSheet(true); }
  scrim.addEventListener('click', () => closeSheet());
  // Свайп вниз за грабер/шапку верхней шторки (делегирование: разметку шторок можно перерисовывать)
  let drag = null;
  document.addEventListener('pointerdown', e => {
    const h = e.target.closest('.sheet__grabber, .sheet__header, [data-drag]');
    const s = h && h.closest('.sheet');
    if (!s || !s.classList.contains('is-open') || s.dataset.sheetId !== open[open.length - 1]) return;
    if (e.target.closest('button, a, [data-close]')) return; // крестик и кнопки в шапке кликаются
    drag = { s, y0: e.clientY, dy: 0 }; s.style.transition = 'none';
  });
  document.addEventListener('pointermove', e => { if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y0); drag.s.style.transform = `translateY(${drag.dy}px)`; });
  const endDrag = () => { if (!drag) return; const { s, dy } = drag; drag = null; s.style.transition = ''; if (dy > 80) closeSheet(); else s.style.transform = ''; };
  document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);

  /* ---------- Тост ---------- */
  const toastEl = $('#toast'); let toastTimer;
  function toast(title, sub = '') {
    $('#toast-title').textContent = title;
    $('#toast-sub').textContent = sub; $('#toast-sub').hidden = !sub;
    // Правило проекта (09.11): тост внизу, 24 px над нижней навигацией (таб-бар / панель экрана / home indicator)
    const dev = $('#device').getBoundingClientRect();
    let edge = dev.bottom - 34;
    const cur = screen(stack[stack.length - 1]);
    if (!tabbar.classList.contains('is-hidden')) edge = Math.min(edge, tabbar.getBoundingClientRect().top);
    if (!open.length) $$('.dg-panel', cur).forEach(p => { if (!p.hidden && p.offsetParent) edge = Math.min(edge, p.getBoundingClientRect().top); });
    toastEl.style.bottom = (dev.bottom - edge + 24) + 'px';
    toastEl.classList.add('is-open');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('is-open'), 2600);
  }

  /* ---------- Делегирование кликов по data-атрибутам ---------- */
  document.addEventListener('click', e => {
    const seg = e.target.closest('.segmented__item');
    if (seg) onSegment(seg);
    const el = e.target.closest('[data-go],[data-back],[data-tab],[data-sheet],[data-close],[data-toast],[data-theme-toggle]');
    if (!el || el.disabled) return;
    const d = el.dataset;
    if ('close' in d) closeSheet();
    if ('sheet' in d) openSheet(d.sheet, { over: 'over' in d });
    if ('toast' in d) setTimeout(() => toast(d.toast, d.toastSub || ''), 'close' in d ? 200 : 0);
    if ('tab' in d) tab(d.tab);
    if ('back' in d) back();
    if ('go' in d) { closeAll(); go(d.go, d.transition || 'push'); }
    if ('themeToggle' in d) setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  /* ---------- Сегмент-контрол: переключение + фильтр списка ---------- */
  function onSegment(item) {
    const seg = item.parentElement;
    $$('.segmented__item', seg).forEach(i => i.classList.toggle('is-active', i === item));
    if (seg.dataset.filter) {
      const v = item.dataset.value;
      $$('[data-kind]', $(seg.dataset.filter)).forEach(c => { c.hidden = v !== 'all' && c.dataset.kind !== v; });
    }
    if ('themeSeg' in seg.dataset) setTheme(item.dataset.value);
  }

  /* ---------- Тема ---------- */
  function setTheme(t) {
    if (t === 'auto') delete root.dataset.theme; else root.dataset.theme = t;
    const label = $('[data-theme-toggle]');
    if (label) label.textContent = root.dataset.theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
    $$('[data-theme-seg] .segmented__item').forEach(i => i.classList.toggle('is-active', i.dataset.value === (root.dataset.theme || 'auto')));
  }
  setTheme(new URLSearchParams(location.search).get('theme') || 'light'); // прототип только в светлой теме: PNG и креативы светлые

  /* ---------- Старт: #экран в адресе ---------- */
  renderMoney();
  const start = location.hash.slice(1);
  if (start && screen(start)) { stack = start === START ? [start] : [START, start]; }
  tabbar.style.transition = 'none';
  setActive(stack[stack.length - 1]);
  requestAnimationFrame(() => requestAnimationFrame(() => { tabbar.style.transition = ''; }));

  /* ---------- Системный «назад» (свайп в iOS, кнопка Android): закрывает шторку или экран, из прототипа не уводит ---------- */
  history.pushState({ guard: 1 }, '', location.href);
  window.addEventListener('popstate', () => {
    if (open.length) closeSheet(); else back();
    history.pushState({ guard: 1 }, '', location.href);
  });
})();

</script>
